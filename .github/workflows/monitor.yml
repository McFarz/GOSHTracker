name: GOSH assistant psychologist vacancies

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose test-feed first; monitor enables normal alerts'
        type: choice
        options:
          - test-feed
          - monitor
          - test-email
        default: test-feed

permissions:
  contents: write

concurrency:
  group: gosh-vacancy-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify monitor
        run: python -m unittest discover -s tests -v
      - name: Check for vacancies
        env:
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
          NHS_EMPLOYER_CODE: ${{ vars.NHS_EMPLOYER_CODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
        run: |
          case "$RUN_MODE" in
            test-feed) python monitor.py --test-feed ;;
            test-email) python monitor.py --test-email ;;
            monitor) python monitor.py ;;
            *) exit 2 ;;
          esac
      - name: Persist successfully checked jobs
        if: github.event_name == 'schedule' || inputs.mode == 'monitor'
        run: |
          if ! git diff --quiet -- seen_jobs.json || [[ -n "$(git ls-files --others --exclude-standard seen_jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "Update GOSH job monitor state"
            git push
          fi
